services:
  # PostgreSQL
  postgres:
    image: postgres:17.11-alpine
    container_name: coliving-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coliving-platform

  # ★ PostgreSQL + pgvector (community-service 전용, FAQ 봇 벡터 검색)
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: coliving-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - coliving-platform

  # MongoDB
  mongodb:
    image: mongo:7.0.45
    container_name: coliving-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - coliving-platform

  # Redis
  redis:
    image: redis:8.10.2
    container_name: coliving-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coliving-platform

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: coliving-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - coliving-platform

  # Zookeeper
  zookeeper:
    image: zookeeper:3.5.9
    container_name: coliving-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    networks:
      - coliving-platform

  # Kafka
  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: coliving-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_LOG_DIRS: /kafka/kafka-logs
      KAFKA_BROKER_ID: 1
    volumes:
      - kafka_data:/kafka
    networks:
      - coliving-platform

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: coliving-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - coliving-platform

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.5
    container_name: coliving-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - coliving-platform

  #prometheus
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: coliving-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coliving-platform

  #grafana
  grafana:
    image: grafana/grafana:12.0.0
    container_name: coliving-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - coliving-platform

  # S3 호환 오브젝트 스토리지. 로컬 테스트 전용이며 배포에는 넣지 않는다.
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: coliving-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: coliving-dev
    ports:
      - "3900:3900"
    configs:
      - source: garage_config
        target: /etc/garage.toml
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - coliving-platform

configs:
  garage_config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "coliving-dev-admin"
      metrics_token = "coliving-dev-metrics"
  #prometheus 설정
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: spring-services
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ['host.docker.internal:18081']
              labels:
                service: api-gateway
            - targets: ['host.docker.internal:8082']
              labels:
                service: user-service
            - targets: ['host.docker.internal:8083']
              labels:
                service: property-service
            - targets: ['host.docker.internal:8084']
              labels:
                service: community-service
            - targets: ['host.docker.internal:8085']
              labels:
                service: reservation-service
            - targets: ['host.docker.internal:8086']
              labels:
                service: dashboard-service
            - targets: ['host.docker.internal:8087']
              labels:
                service: document-service
            - targets: ['host.docker.internal:8089']
              labels:
                service: contract-service
            - targets: ['host.docker.internal:8761']
              labels:
                service: eureka-server
            - targets: ['host.docker.internal:8888']
              labels:
                service: config-server

volumes:
  postgres_data:
  pgvector_data:   # ★ 추가
  mongo_data:
  redis_data:
  rabbitmq_data:
  zookeeper_data:
  zookeeper_datalog:
  kafka_data:
  elasticsearch_data:
  grafana_data:
  garage_meta:
  garage_data:

networks:
  coliving-platform:
    driver: bridge