server:
  port: 8087

spring:
  application:
    name: document-service
  config:
    import: "optional:configserver:http://localhost:8888/"
    fail-fast: true
  profiles:
    active: dev
  grpc:
    server:
      port: 9087   # gRPC 서버 포트
  datasource:
    url: jdbc:postgresql://localhost:5432/document_service
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true