server:
  port: 8089        # 팀 포트 배정표 확인 필요 (8082는 user-service)

spring:
  application:
    name: contract-service
  grpc:
    server:
      port: 9089      # gRPC 서버 포트 (community-service가 접속). HTTP 포트(8089)와 별개
  config:
    import: "optional:configserver:http://localhost:8888/"
  profiles:
    # 쉼표로 추가. dummy-document: 문서 서비스 없이 가짜 양식 (dummy-room은 2026-11-05 삭제: 호실 정보는 화면이 보냄)
    # dummy-portone: 포트원 시크릿 없이 본인인증 흉내 (실제 인증 테스트 시 빼고 PORTONE_API_SECRET 설정)
    # dummy-kakaopay: 카카오페이 시크릿 키 없이 결제 흉내 (실제 결제 테스트 시 빼고 KAKAOPAY_SECRET_KEY 설정)
    active: dev #, dummy-portone, dummy-kakaopay
  cloud:
    config:
      label: dev   # config 저장소 dev 브랜치를 읽음
  # 메일: Gmail SMTP. 비밀번호는 Google 계정의 "앱 비밀번호"(16자리)이며 절대 커밋하지 말 것 → 환경변수로
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# 계약서 언어 → 문서 서비스 양식 번호(document_forms.id)
# ⚠ 문서 담당자에게 실제 번호를 받아서 바꿀 것. 확정되면 config 저장소 contract-service.yaml로 옮긴다
app:
  payment:
    reconcile:                # 결제 PENDING 보정 스케줄러 (PaymentReconcileScheduler)
      interval: PT5M          # 5분마다
      min-age: PT10M          # 만든 지 10분 지난 PENDING만 (결제 중인 사람은 건드리지 않게)
      timeout: PT20M          # 진행 중 상태로 20분 지나면 실패 처리 (카카오 결제 유효시간 15분 + 스케줄러 주기 여유)
      batch-size: 50          # 한 번에 처리할 건수
  outbox:
    publisher:                # outbox → Kafka 발행 (OutboxPublishScheduler)
      enabled: true           # Kafka 없이 로컬 개발할 때는 false
      interval: PT10S         # 10초마다 대기 이벤트 발행
      batch-size: 50          # 한 번에 보낼 건수
      max-retry: 100          # 이만큼 실패하면 FAILED로 두고 수동 확인 (브로커 장애가 길면 이 값이 시간 한도)
      send-timeout: PT5S      # 한 건을 보낼 때 브로커 응답을 기다리는 시간
  mail:                       # 계약 메일 (ContractMailProperties)
    enabled: ${MAIL_ENABLED:true}            # false면 로그만 남김. 실제 발송은 MAIL_ENABLED=true
    from: ${MAIL_USERNAME:}                   # Gmail은 로그인 계정 주소여야 함
    from-name: Roomlink
    link-base-url: ${USER_WEB_URL:http://localhost:5173}   # 메일 버튼이 여는 사용자 화면
  receipt: # 결제 영수증 PDF 상단 사업자 정보 (ReceiptBusinessProperties)
    business: # 공개 정보(사이트 하단 표기와 동일)라 yaml에 직접 둔다. 비밀값 아님
      name: Roomlink
      business-number: 100-292-4421
      representative: 조휘재
      address: 서울특별시 마포구 백범로 3층
