// ============================================================
// 대시보드 서비스 ↔ 매물 서비스 gRPC 계약서
// 서버: property-service / 클라이언트: dashboard-service
// ⚠ 두 서비스가 똑같은 내용으로 가지고 있어야 함. 필드 번호는 바꾸거나 재사용하지 않고, 지울 때는 reserved
// ============================================================
syntax = "proto3";

package coliving.property.v1;

option java_multiple_files = true;
option java_package = "com.coliving.platform.grpc.property";
option java_outer_classname = "PropertyServiceProto";

service PropertyService {
  // 건물의 호실 목록. 호실 현황을 처음 구성하거나 호실이 추가될 때 호출한다.
  // 삭제된 호실은 서버가 빼서 보낸다.
  rpc ListBuildingRooms (ListBuildingRoomsRequest) returns (ListBuildingRoomsResponse);
}

message ListBuildingRoomsRequest {
  int64 building_id = 1;  // 건물 ID
}

message ListBuildingRoomsResponse {
  int64 building_id = 1;      // buildings.id
  string building_name = 2;   // buildings.building_name
  repeated Room rooms = 3;
}

message Room {
  int64 room_id = 1;     // rooms.id
  int32 floor = 2;       // rooms.floor_number
  string room_name = 3;  // rooms.room_name
}
