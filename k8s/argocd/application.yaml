# 부트스트랩 (project.yaml 다음, 한 번):
#   kubectl apply -f k8s/argocd/application.yaml
# Argo CD는 main의 k8s/base 를 읽는다. origin/main에 반영되어 있어야 Sync 된다.
# 자동 Sync는 꺼져 있다. docs/배포-가이드.md 3장의 패치 파일로 Sync 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coliving-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: coliving
  source:
    repoURL: https://github.com/ibm05-team-3/coliving-platform.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: coliving
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
