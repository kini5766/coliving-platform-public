apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: coliving-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: coliving-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: zookeeper
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: coliving-platform
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare-datalog
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # subPath 는 fsGroup 이 소유권을 바꾸지 않는다. 이미지 사용자(uid 1000)가 쓰게 맞춘다.
          command: ["sh", "-c", "mkdir -p /data/datalog && chown 1000:1000 /data/datalog"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: zookeeper
          image: zookeeper:3.5.9
          imagePullPolicy: IfNotPresent
          env:
            - name: JVMFLAGS
              value: "-Xms128m -Xmx256m"
          ports:
            - name: client
              containerPort: 2181
          volumeMounts:
            - name: data
              mountPath: /data
            # dataLogDir. 컨테이너 층에만 두면 파드가 다시 만들어질 때 클러스터 ID가 사라진다.
            - name: data
              mountPath: /datalog
              subPath: datalog
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: coliving-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: coliving-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: kafka
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: coliving-platform
    spec:
      initContainers:
        - name: wait-zookeeper
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z zookeeper 2181; do sleep 2; done"]
      containers:
        - name: kafka
          image: wurstmeister/kafka:2.13-2.8.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_LOG_DIRS
              value: /kafka/kafka-logs
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /kafka
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
