apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: coliving-platform
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: management
      port: 18081
      targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: coliving-platform
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: coliving-platform
    spec:
      initContainers:
        - name: wait-eureka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z eureka-server 8761; do sleep 2; done"]
      containers:
        - name: api-gateway
          image: ghcr.io/ibm05-team-3/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
            - name: management
              containerPort: 18081
          envFrom:
            - configMapRef:
                name: coliving-runtime
          env:
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: coliving-app
                  key: JWT_PUBLIC_KEY
            - name: EUREKA_INSTANCE_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: EUREKA_INSTANCE_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Seoul"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
