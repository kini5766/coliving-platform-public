apiVersion: v1
kind: Service
metadata:
  name: user-web
  labels:
    app.kubernetes.io/name: user-web
    app.kubernetes.io/part-of: coliving-platform
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    app.kubernetes.io/name: user-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-web
  labels:
    app.kubernetes.io/name: user-web
    app.kubernetes.io/part-of: coliving-platform
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-web
        app.kubernetes.io/part-of: coliving-platform
    spec:
      containers:
        - name: user-web
          image: ghcr.io/ibm05-team-3/user-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
